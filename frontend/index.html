<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petite Bow — Toko Coquette</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo script" onclick="go('shop')">🎀 Petite Bow</div>
  <nav>
    <span id="auth"></span>
    <button class="btn" onclick="toggleCart(true)">Keranjang 🛒<span class="badge" id="cnt">0</span></button>
  </nav>
</header>
<div class="lace"></div>
<main id="app"></main>
<footer class="script">made with love &amp; ribbons 🎀</footer>

<div class="overlay" id="ov" onclick="if(event.target===this)closeOv()"><div class="modal" id="modal"></div></div>
<div class="drawer" id="drawer">
  <button class="x" onclick="toggleCart(false)">✕</button>
  <h2 class="script title">Keranjangmu</h2>
  <div class="items" id="items"></div>
  <div class="tot"><span>Total</span><b id="total">Rp0</b></div>
  <button class="btn" onclick="openCheckout()">Checkout 💌</button>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
